<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Campus Events</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" style="text-align: center; max-width: 600px; margin-top: 5rem;">
        <div class="glass" style="padding: 3rem;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
            <h1 style="margin-bottom: 1rem;">Oops! Something went wrong.</h1>
            <p style="margin-bottom: 2rem; color: #ef4444;" th:text="${errorMessage}">An error occurred.</p>
            <a th:href="@{/}" class="btn btn-primary">Back to Home</a>
        </div>
    </div>
</body>
</html>
