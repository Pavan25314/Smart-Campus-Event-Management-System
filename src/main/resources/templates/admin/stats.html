<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Statistics | Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="background: #0f172a;">
    <div class="container">
        <header>
            <div class="logo">AdminStats</div>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline" style="color: #fff; border-color: #fff;">Back to Dashboard</a>
        </header>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 3rem;">
            <div class="glass" style="padding: 2rem; background: #fff;">
                <h2 style="margin-bottom: 2rem;">Registration Overview</h2>
                <canvas id="registrationChart"></canvas>
            </div>

            <div class="glass" style="padding: 2rem; background: #fff;">
                <h2 style="margin-bottom: 1.5rem;">Quick Stats</h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div style="padding: 1.5rem; background: #f8fafc; border-radius: var(--radius);">
                        <p style="color: var(--text-muted); font-size: 0.8rem;">Total Events</p>
                        <h3 style="font-size: 2rem;" th:text="${#lists.size(events)}">0</h3>
                    </div>
                    <div style="padding: 1.5rem; background: #f8fafc; border-radius: var(--radius);">
                        <p style="color: var(--text-muted); font-size: 0.8rem;">Total Registrations</p>
                        <h3 style="font-size: 2rem;" th:text="${#aggregates.sum(events.![registrationsCount])}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass" style="padding: 2rem; background: #fff;">
            <h2 style="margin-bottom: 1.5rem;">Detailed Event Breakdown</h2>
            <table style="width: 100%; border-collapse: collapse;">
                <thead style="background: #f1f5f9;">
                    <tr>
                        <th style="padding: 1rem; text-align: left;">Event</th>
                        <th style="padding: 1rem; text-align: left;">Capacity</th>
                        <th style="padding: 1rem; text-align: left;">Registered</th>
                        <th style="padding: 1rem; text-align: left;">Fill Rate</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="event : ${events}" style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 1rem;" th:text="${event.title}">Title</td>
                        <td style="padding: 1rem;" th:text="${event.capacity}">100</td>
                        <td style="padding: 1rem;" th:text="${event.registrationsCount}">50</td>
                        <td style="padding: 1rem;">
                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                <div style="flex-grow: 1; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;">
                                    <div th:style="'width: ' + (${event.registrationsCount} * 100 / ${event.capacity}) + '%; height: 100%; background: var(--primary);'"></div>
                                </div>
                                <span style="font-size: 0.8rem;" th:text="${#numbers.formatDecimal(event.registrationsCount * 100.0 / event.capacity, 1, 1)} + '%'">50%</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const statsData = /*[[${stats}]]*/ [];
        const labels = statsData.map(item => item[0]);
        const counts = statsData.map(item => item[1]);

        const ctx = document.getElementById('registrationChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Registrations',
                    data: counts,
                    backgroundColor: 'rgba(79, 70, 229, 0.6)',
                    borderColor: 'rgb(79, 70, 229)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
        /*]]>*/
    </script>
</body>
</html>
