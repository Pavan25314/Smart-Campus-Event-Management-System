<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Campus Events</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body style="background: #0f172a;">
    <div class="container">
        <header>
            <div class="logo">AdminPortal</div>
            <nav>
                <a th:href="@{/admin/events/stats}" class="btn btn-outline" style="color: #fff; border-color: #fff; margin-right: 1rem;">View Statistics</a>
                <a th:href="@{/}" class="btn btn-outline" style="color: #fff; border-color: #fff; margin-right: 1rem;">View Public Site</a>
                <a th:href="@{/admin/events/new}" class="btn btn-primary">Add New Event</a>
            </nav>
        </header>

        <div class="glass" style="padding: 1.5rem; margin-bottom: 2rem; background: rgba(255,255,255,0.05); color: #fff;">
            <form th:action="@{/admin/dashboard}" method="get" style="display: flex; gap: 1rem; align-items: flex-end;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Department</label>
                    <select name="department" style="background: #1e293b; color: #fff; border-color: #334155;">
                        <option value="">All Departments</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Arts">Arts</option>
                        <option value="Engineering">Engineering</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Type</label>
                    <select name="type" style="background: #1e293b; color: #fff; border-color: #334155;">
                        <option value="">All Types</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Seminar">Seminar</option>
                        <option value="Cultural">Cultural</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Filter</button>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline" style="color: #fff; border-color: #334155;">Clear</a>
            </form>
        </div>

        <div class="glass" style="padding: 0; overflow: hidden; background: #fff;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead style="background: #f1f5f9;">
                    <tr>
                        <th style="padding: 1rem;">Title</th>
                        <th style="padding: 1rem;">Department</th>
                        <th style="padding: 1rem;">Date</th>
                        <th style="padding: 1rem;">Registrations</th>
                        <th style="padding: 1rem;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="event : ${events}" style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 1rem; font-weight: 600;" th:text="${event.title}">Event Name</td>
                        <td style="padding: 1rem;" th:text="${event.department}">Dept</td>
                        <td style="padding: 1rem;" th:text="${#temporals.format(event.eventDate, 'dd/MM/yyyy')}">Date</td>
                        <td style="padding: 1rem;">
                            <span th:text="${event.registrationsCount} + ' / ' + ${event.capacity}">0/50</span>
                        </td>
                        <td style="padding: 1rem;">
                            <a th:href="@{/admin/events/edit/{id}(id=${event.id})}" style="color: var(--primary); text-decoration: none; margin-right: 1rem;">Edit</a>
                            <a th:href="@{/admin/events/delete/{id}(id=${event.id})}" style="color: #ef4444; text-decoration: none;" 
                               onclick="return confirm('Are you sure you want to delete this event?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
