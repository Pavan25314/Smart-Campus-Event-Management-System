<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registrations | Campus Events</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <a th:href="@{/}" class="logo">CampusEvents</a>
            <a th:href="@{/}" class="btn btn-outline">Back to Home</a>
        </header>

        <div class="glass" style="padding: 2rem; margin-bottom: 2rem; max-width: 600px; margin-left: auto; margin-right: auto;">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Find Your Registrations</h2>
            <form th:action="@{/my-registrations}" method="get" style="display: flex; gap: 1rem;">
                <input type="email" name="email" placeholder="Enter your registered email" required style="flex-grow: 1;">
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </div>

        <div th:if="${registrations != null}" class="registration-list" style="max-width: 800px; margin: 0 auto;">
            <h2 style="margin-bottom: 2rem; color: #fff; text-align: center;" th:text="'Registrations for ' + ${param.email}">Email</h2>
            
            <div th:each="reg : ${registrations}" class="glass" style="padding: 1.5rem; margin-bottom: 2rem; background: #fff;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                    <div>
                        <h3 th:text="${reg.event.title}">Event Title</h3>
                        <p style="color: var(--text-muted); font-size: 0.9rem;">
                            <span th:text="${#temporals.format(reg.event.eventDate, 'dd MMM yyyy, HH:mm')}">Date</span> • 
                            <span th:text="${reg.event.location}">Location</span>
                        </p>
                    </div>
                    <div style="font-weight: 600; color: var(--primary);">Confirmed</div>
                </div>

                <div th:if="${reg.rating == null}" style="border-top: 1px solid #eee; padding-top: 1rem;">
                    <p style="font-size: 0.9rem; margin-bottom: 0.5rem; font-weight: 600;">How was the event? Share your feedback:</p>
                    <form th:action="@{/feedback}" method="post">
                        <input type="hidden" name="registrationId" th:value="${reg.id}">
                        <input type="hidden" name="email" th:value="${reg.studentEmail}">
                        <div style="display: flex; gap: 1rem; margin-bottom: 0.5rem;">
                            <select name="rating" required style="width: auto;">
                                <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
                                <option value="4">⭐⭐⭐⭐ (Good)</option>
                                <option value="3">⭐⭐⭐ (Average)</option>
                                <option value="2">⭐⭐ (Poor)</option>
                                <option value="1">⭐ (Very Poor)</option>
                            </select>
                            <input type="text" name="feedback" placeholder="Your comments..." style="flex-grow: 1;">
                            <button type="submit" class="btn btn-primary" style="padding: 0.5rem 1rem;">Submit</button>
                        </div>
                    </form>
                </div>
                
                <div th:if="${reg.rating != null}" style="border-top: 1px solid #eee; padding-top: 1rem; background: #f8fafc; padding: 1rem; border-radius: 8px;">
                    <p style="font-size: 0.9rem;"><strong>Your Rating:</strong> <span th:text="${reg.rating} + '/5'">5/5</span></p>
                    <p style="font-size: 0.9rem;" th:text="${reg.feedback}">Feedback content</p>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(registrations)}" style="text-align: center; padding: 3rem; color: #fff;">
                <h3>No registrations found for this email.</h3>
            </div>
        </div>
    </div>
</body>
</html>
