<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Campus Events</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    
    <div class="glass" style="max-width: 450px; width: 100%; padding: 3rem 2rem; text-align: center;">
        <div class="logo" style="margin-bottom: 2rem; font-size: 2rem;">AdminPortal</div>
        
        <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Please sign in to manage campus events.</p>

        <div th:if="${param.error}" style="background: #fee2e2; color: #ef4444; padding: 1rem; border-radius: var(--radius); margin-bottom: 1.5rem; font-size: 0.9rem;">
            Invalid username and password.
        </div>
        
        <div th:if="${param.logout}" style="background: #dcfce7; color: #22c55e; padding: 1rem; border-radius: var(--radius); margin-bottom: 1.5rem; font-size: 0.9rem;">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post" style="text-align: left;">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required 
                       style="background: rgba(255,255,255,0.5); font-size: 1rem;">
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required 
                       style="background: rgba(255,255,255,0.5); font-size: 1rem;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 1rem;">
                Sign In to Dashboard
            </button>
        </form>
        
        <div style="margin-top: 2rem; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 1.5rem;">
            <a th:href="@{/}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'">
                ← Back to Public Site
            </a>
        </div>
    </div>

</body>
</html>
